name: REGOLO MCP Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mcp-security-gate:
    name: MCP Security Scan & AI Remediation (REGOLO brick-complexity-pro)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Download REGOLO MCP Security Gate
        run: |
          echo "Cloning REGOLO MCP Security Gate from https://github.com/regolo-ai/tutorials/mcp-scan-security-repo..."
          # If running within the security gate repository itself, use local codebase;
          # otherwise clone the security gate suite into .regolo-security-gate
          if [ -d "gate" ] && [ -f "regolo.py" ]; then
            echo "Running from local REGOLO Security Gate codebase."
            GATE_DIR="."
          else
            git clone --depth 1 https://github.com/regolo-ai/tutorials/mcp-scan-security-repo.git .regolo-security-gate
            GATE_DIR=".regolo-security-gate"
            export PYTHONPATH="$GATE_DIR:$PYTHONPATH"
          fi
          echo "GATE_DIR=$GATE_DIR" >> $GITHUB_ENV
          pip install --upgrade pip
          pip install -r $GATE_DIR/requirements.txt

      - name: Scan Project for MCP Security Violations (Excluding .gitignore)
        id: mcp_scan
        run: |
          echo "======================================================================"
          echo " Scanning project files using MCP SECURITY GATE..."
          echo "======================================================================"

          # git ls-files inspects all project files while respecting .gitignore
          TRACKED_FILES=$(git ls-files | grep -E '\.(py|js|ts|json)$' || true)
          VIOLATIONS_FOUND=0
          FAILED_FILE=""

          for FILE in $TRACKED_FILES; do
            # Skip gate internals, tests, package.json, and lockfile
            if [[ "$FILE" =~ ^(\.regolo-security-gate|gate|tests)/ ]] || [[ "$FILE" == "mcp-lock.json" ]] || [[ "$FILE" == "package.json" ]]; then
              continue
            fi
            # In demo test environments, skip demo exploit fixtures unless testing remediation
            if [[ "$FILE" =~ demo/(poisoned_server|rugpull_server/v2|sample_claude_desktop_config) ]]; then
              continue
            fi

            # Check if file defines an MCP tool or server
            if grep -qE '(tools/list|@mcp\.tool|server\.tool|mcpServers|inputSchema)' "$FILE" 2>/dev/null; then
              echo "Auditing MCP definition: $FILE"
              if ! python3 -m gate.gate_cli scan "$FILE" --server-name "$(basename $FILE .py)"; then
                echo "VULNERABILITY DETECTED in $FILE"
                VIOLATIONS_FOUND=1
                FAILED_FILE="$FILE"
              fi
            fi
          done

          echo "VIOLATIONS_FOUND=$VIOLATIONS_FOUND" >> $GITHUB_OUTPUT
          echo "FAILED_FILE=$FAILED_FILE" >> $GITHUB_ENV

          if [ "$VIOLATIONS_FOUND" -eq 1 ]; then
            echo "Security gate detected threats. Initiating REGOLO AI remediation..."
          else
            echo "All MCP tools passed static security scan."
          fi

      - name: AI Remediation with REGOLO brick-complexity-pro
        if: steps.mcp_scan.outputs.VIOLATIONS_FOUND == '1'
        env:
          REGOLO_API_KEY: ${{ secrets.REGOLO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================================================"
          echo " Calling REGOLO API (brick-complexity-pro) for automated remediation..."
          echo "======================================================================"

          # Sanitize offending file using REGOLO API
          python3 -m gate.gate_cli remediate "$FAILED_FILE" --server-name "$(basename $FAILED_FILE .py)"

          # Export fresh mcp-lock.json with newly sanitized fingerprints
          python3 -m gate.gate_cli lock --out mcp-lock.json

          # Configure Git and create remediation branch
          git config user.name "regolo-security-bot[bot]"
          git config user.email "security-bot@regolo.ai"
          BRANCH_NAME="regolo/remediate-mcp-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git add "$FAILED_FILE" mcp-lock.json
          git commit -m "fix(security): sanitize MCP tool definitions with REGOLO brick-complexity-pro"
          git push origin "$BRANCH_NAME"

          # Open Pull Request proposing the sanitized code
          gh pr create \
            --title "Fix(Security): Sanitize MCP tool definitions via REGOLO brick-complexity-pro" \
            --body "### REGOLO Automated Security Remediation

          **Vulnerability Detected**: The MCP tool in \`$FAILED_FILE\` was flagged for covert prompt injection / tool poisoning.

          **Remediation Applied**:
          - Neutralized hidden directives and credential exfiltration targets.
          - Re-generated clean tool schema preserving core utility.
          - Updated \`mcp-lock.json\` with cryptographic SHA-256 fingerprint verified by **REGOLO brick-complexity-pro**.

          Please review and merge this Pull Request to restore repository security." \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --head "$BRANCH_NAME"

          echo "Remediation Pull Request opened successfully."
          exit 1

      - name: Verify Lockfile Integrity
        if: steps.mcp_scan.outputs.VIOLATIONS_FOUND == '0'
        run: |
          python3 -m gate.gate_cli lock --out mcp-lock.json
          git diff --exit-code mcp-lock.json || (echo "ERROR: mcp-lock.json drift!" && exit 1)

      - name: Defensive Self-Test (Assert Gate Blocks Malicious Attacks)
        run: |
          echo "Validating that the gate strictly blocks poisoned MCP servers..."
          if python3 -m gate.gate_cli scan demo/poisoned_server/server.py; then
            echo "CRITICAL SECURITY FAILURE: Poisoned MCP server was NOT blocked by the gate!"
            exit 1
          else
            echo "DEFENSE VERIFIED: Poisoned MCP server was blocked with exit code 1."
          fi
