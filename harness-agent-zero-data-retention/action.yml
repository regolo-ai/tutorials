name: "Regolo CodeOps ZDR — OpenHarness"
description: "Privacy-first automated code review and fix agent powered by open models on Regolo EU Zero Data Retention infrastructure."
author: "Regolo"
branding:
  icon: "shield"
  color: "green"

inputs:
  regolo_api_key:
    description: "Regolo API Key (https://regolo.ai)"
    required: true
  regolo_base_url:
    description: "Regolo Base URL endpoint"
    required: false
    default: "https://api.regolo.ai/v1"
  model:
    description: "Open model to use on Regolo (default: gpt-oss-120b)"
    required: false
    default: "gpt-oss-120b"
  base_branch:
    description: "Target base branch for PR comparison (e.g. origin/main)"
    required: false
    default: "origin/main"
  auto_fix:
    description: "Automatically generate code fixes"
    required: false
    default: "true"
  thinking_effort:
    description: "Reasoning / thinking effort for reasoning models (e.g. low, medium, high)"
    required: false
    default: "low"
  path:
    description: "Path to the repository to inspect"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Regolo Agent Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip -q
        pip install -r "${{ github.action_path }}/requirements.txt" -q

    - name: Run Regolo ZDR Code Review
      shell: bash
      env:
        REGOLO_API_KEY: ${{ inputs.regolo_api_key }}
        REGOLO_BASE_URL: ${{ inputs.regolo_base_url }}
        REGOLO_MODEL: ${{ inputs.model }}
        REGOLO_THINKING_EFFORT: ${{ inputs.thinking_effort }}
        PYTHONPATH: "${{ github.action_path }}"
      run: |
        FIX_FLAG=""
        if [ "${{ inputs.auto_fix }}" = "true" ]; then
          FIX_FLAG="--fix"
        fi
        python3 -m regolo_agent_stack.cli review --path "${{ inputs.path }}" --scope pr --base "${{ inputs.base_branch }}" $FIX_FLAG
