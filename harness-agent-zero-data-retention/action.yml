name: "Regolo CodeOps ZDR — OpenHarness"
description: "Privacy-first automated code review and fix agent powered by open models on Regolo EU Zero Data Retention infrastructure."
author: "Regolo"
branding:
  icon: "shield"
  color: "green"

inputs:
  regolo_api_key:
    description: "Regolo API Key (https://regolo.ai)"
    required: true
  regolo_base_url:
    description: "Regolo Base URL endpoint"
    required: false
    default: "https://api.regolo.ai/v1"
  model:
    description: "Open model to use on Regolo (default: gpt-oss-120b)"
    required: false
    default: "gpt-oss-120b"
  base_branch:
    description: "Target base branch for PR comparison (e.g. origin/main)"
    required: false
    default: "origin/main"
  auto_fix:
    description: "Automatically generate code fixes"
    required: false
    default: "true"
  thinking_effort:
    description: "Reasoning / thinking effort for reasoning models (e.g. low, medium, high)"
    required: false
    default: "low"
  path:
    description: "Path to the repository to inspect"
    required: false
    default: "."
  github_token:
    description: "GitHub Token for opening Pull Requests (defaults to github.token)"
    required: false
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Regolo Agent Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip -q
        pip install -r "${{ github.action_path }}/requirements.txt" -q

    - name: Run Regolo ZDR Code Review
      shell: bash
      env:
        REGOLO_API_KEY: ${{ inputs.regolo_api_key }}
        REGOLO_BASE_URL: ${{ inputs.regolo_base_url }}
        REGOLO_MODEL: ${{ inputs.model }}
        REGOLO_THINKING_EFFORT: ${{ inputs.thinking_effort }}
        PYTHONPATH: "${{ github.action_path }}"
      run: |
        FIX_FLAG=""
        if [ "${{ inputs.auto_fix }}" = "true" ]; then
          FIX_FLAG="--fix --apply"
        fi
        python3 -m regolo_agent_stack.cli review --path "${{ inputs.path }}" --scope pr --base "${{ inputs.base_branch }}" $FIX_FLAG

    - name: Create Pull Request with Auto-Fixes
      if: ${{ inputs.auto_fix == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BASE_BRANCH: ${{ inputs.base_branch }}
      run: |
        # Check if working tree has any modifications
        STATUS_OUT=$(git status --porcelain)
        if [ -z "$STATUS_OUT" ]; then
          echo "ℹ️ No changes detected after auto-fix."
          exit 0
        fi

        echo "🚀 Auto-fixes applied to repository. Preparing Pull Request..."
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        PR_BRANCH="regolo-autofix-$(date +%s)"
        git checkout -b "$PR_BRANCH"
        git add -A
        git commit -m "fix(security): apply automated fixes via Regolo ZDR"

        if [ "$ACT" = "true" ] || [ -z "$GH_TOKEN" ]; then
          echo "ℹ️ Running in local/test environment (ACT=$ACT). Branch '$PR_BRANCH' created and committed locally."
          git show --stat
          exit 0
        fi

        git push -u origin "$PR_BRANCH"
        PR_TITLE="🤖 [Regolo ZDR] Automated security & code quality fixes"
        PR_BODY="### 🛡️ Regolo EU ZDR Automated Code Fixes\n\nThis Pull Request was generated automatically by **Regolo CodeOps ZDR** with fixes for vulnerabilities identified during review.\n\n- Infrastructure: EU Zero Data Retention (Regolo)\n- Target base branch: ${BASE_BRANCH}\n- Validation: AST syntax verified."

        gh pr create \
          --base "${BASE_BRANCH#origin/}" \
          --head "$PR_BRANCH" \
          --title "$PR_TITLE" \
          --body "$PR_BODY" || echo "⚠️ gh pr create failed. Verify GITHUB_TOKEN has 'pull-requests: write' and 'contents: write' permissions."
