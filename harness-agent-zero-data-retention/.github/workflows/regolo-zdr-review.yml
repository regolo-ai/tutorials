name: "Regolo ZDR Code Review"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Regolo ZDR Code Review & Auto-Fix
        # In this repository, use the local Action (./). 
        # In any other external project, use: uses: regolo-ai/tutorials/harness-agent-zero-data-retention@main
        uses: ./harness-agent-zero-data-retention
        with:
          regolo_api_key: ${{ secrets.REGOLO_API_KEY }}
          model: gpt-oss-120b
          thinking_effort: "low"
          base_branch: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || 'main' }}
          auto_fix: "true"
          # Path to inspect (use "." for full repo, or specify subfolder)
          path: "harness-agent-zero-data-retention/demo" 
