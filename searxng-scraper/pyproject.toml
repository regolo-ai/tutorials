[project]
name = "regolo-private-search-starter"
version = "1.0.0"
description = "Private web research API using SearXNG and Regolo.ai"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "setuptools",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
