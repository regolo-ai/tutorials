services:
  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=regolo-private-search
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

  api:
    build: .
    env_file: .env
    environment:
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
    ports:
      - "8000:8000"

