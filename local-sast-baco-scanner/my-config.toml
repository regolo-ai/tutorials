# BACO Scanner Configuration generated by Baco TUI
# Provider: Regolo.ai (OpenAI-compatible)

[project]
name = "regolo-security-scan"
path = "/Users/alexgenovese/Desktop/regolo/video/6 - Baco Scanner/demo-vulnerable-app"
languages = ["c", "cpp", "python", "rust", "javascript"]

[output]
dir = "./baco-output"
evidence_gate = false

[scanner]
max_file_size_kb = 256
exclude_paths = [
    "tests/**",
    "test/**",
    "target/**",
    "node_modules/**",
    ".git/**",
    ".venv/**",
    "venv/**",
    "env/**",
    ".env/**",
    "**/__pycache__/**",
    "dist/**",
    "build/**",
    ".idea/**",
    ".vscode/**",
    "*.log",
    "*.jsonl",
    "*.txt",
    "*.csv",
    ".env*",
    "*.key",
    "*.pem",
    "secrets/**",
    "credentials/**"
]

[scanner.performance]
enable_incremental_scan = false
max_parallel_tasks = 2
enable_file_filtering = true
enable_root_cause_dedup = true
enable_multi_verifier = false
enable_auto_patching = false
enable_poc_compilation = false
enable_confidence_refinement = true
enable_cve_bootstrap = false
enable_variant_search = true

[llm]
timeout_secs = 240
max_retries = 3
retry_backoff_ms = 2000
max_concurrent = 2
temperature = 0.5
enable_llm_cache = false

