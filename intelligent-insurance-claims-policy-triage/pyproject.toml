[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claims-triage"
version = "0.1.0"
description = "Multi-tier AI Insurance Claims & Policy Triage using OpenJev and Brick"
authors = [{ name = "Alex Genovese / Regolo.ai" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ml = [
    "torch>=2.0",
    "transformers>=4.40",
    "rlcd",
]

[tool.setuptools.packages.find]
where = ["src"]
